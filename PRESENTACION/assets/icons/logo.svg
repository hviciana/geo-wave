<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="terrascopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#318bff"/>
            <stop offset="100%" stop-color="#32d5e6"/>
        </linearGradient>
        <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0e2347"/>
            <stop offset="100%" stop-color="#050914"/>
        </radialGradient>
    </defs>
    <rect width="200" height="200" rx="32" fill="url(#spaceGlow)" stroke="#318bff" stroke-width="2"/>
    <!-- Outer Orbit -->
    <ellipse cx="100" cy="100" rx="80" ry="32" fill="none" stroke="#32d5e6" stroke-width="2" stroke-dasharray="6,4" transform="rotate(-25 100 100)"/>
    <!-- Inner Core Planet -->
    <circle cx="100" cy="100" r="42" fill="url(#terrascopeGrad)"/>
    <!-- Atmosphere Ring -->
    <circle cx="100" cy="100" r="50" fill="none" stroke="#32d5e6" stroke-width="1.5" opacity="0.6"/>
    <!-- Satellite Satellite Antenna Vector -->
    <circle cx="155" cy="74" r="6" fill="#f4f7fc" stroke="#32d5e6" stroke-width="2"/>
    <line x1="155" y1="74" x2="168" y2="65" stroke="#32d5e6" stroke-width="2"/>
</svg>