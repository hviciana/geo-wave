<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffd700"/>
            <stop offset="100%" stop-color="#cc8800"/>
        </linearGradient>
        <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
    </defs>
    <!-- Stars Background -->
    <rect width="400" height="300" fill="#050914"/>
    <circle cx="50" cy="40" r="1" fill="#fff"/>
    <circle cx="120" cy="80" r="1.5" fill="#32d5e6"/>
    <circle cx="340" cy="50" r="1.2" fill="#fff"/>
    <circle cx="360" cy="220" r="1" fill="#fff"/>
    
    <!-- Large 12-meter Deployable Radar Reflector (ISRO / NASA Drum Antenna) -->
    <ellipse cx="200" cy="90" rx="95" ry="40" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-dasharray="8,3"/>
    <ellipse cx="200" cy="90" rx="75" ry="30" fill="none" stroke="#cc8800" stroke-width="1.5"/>
    <ellipse cx="200" cy="90" rx="45" ry="18" fill="none" stroke="#ffd700" stroke-width="1"/>
    
    <!-- Boom structure connecting radar to bus -->
    <line x1="200" y1="90" x2="200" y2="160" stroke="#98a8bd" stroke-width="3"/>
    <line x1="185" y1="120" x2="200" y2="160" stroke="#5e718d" stroke-width="1.5"/>
    <line x1="215" y1="120" x2="200" y2="160" stroke="#5e718d" stroke-width="1.5"/>

    <!-- Spacecraft Main Bus (CubeSat / Service Module) -->
    <rect x="175" y="160" width="50" height="60" rx="4" fill="url(#foilGrad)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Solar Array Wings Left and Right -->
    <rect x="50" y="175" width="115" height="32" rx="2" fill="url(#solarGrad)" stroke="#318bff" stroke-width="1.5"/>
    <line x1="88" y1="175" x2="88" y2="207" stroke="#318bff" stroke-width="1"/>
    <line x1="126" y1="175" x2="126" y2="207" stroke="#318bff" stroke-width="1"/>
    
    <rect x="235" y="175" width="115" height="32" rx="2" fill="url(#solarGrad)" stroke="#318bff" stroke-width="1.5"/>
    <line x1="273" y1="175" x2="273" y2="207" stroke="#318bff" stroke-width="1"/>
    <line x1="311" y1="175" x2="311" y2="207" stroke="#318bff" stroke-width="1"/>

    <!-- Radar Waves emitted downwards -->
    <path d="M 160,240 Q 200,260 240,240" fill="none" stroke="#32d5e6" stroke-width="2" opacity="0.8"/>
    <path d="M 130,265 Q 200,295 270,265" fill="none" stroke="#318bff" stroke-width="1.5" opacity="0.5"/>
</svg>
